default_language_version:
    python: python3
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-xml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
    -   id: check-json
    -   id: pretty-format-json
        args: ['--no-sort-keys', '--autofix', '--indent=2']
-   repo: local
    hooks:
    -   id: generate-manifests-check
        name: generate manifests check
        entry: python3 tools/generate_manifests.py --check
        language: system
        pass_filenames: false
        files: '^(catalogs/.*\.json|manifests/_remotes\.xml|manifests/default\.xml|manifests/generated/.*\.xml)$'
