default_language_version:
    python: python3
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-xml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
    -   id: check-json
    -   id: pretty-format-json
        args: ['--no-sort-keys', '--autofix', '--indent=2']
-   repo: local
    hooks:
    -   id: generate-manifests-excel-check
        name: generate manifests check (excel)
        entry: python3 tools/generate_manifests.py --excel --check
        language: system
        pass_filenames: false
        files: '^catalogs/manifests\.xlsx$'
    -   id: validate-manifests-xlsx
        name: validate manifests.xlsx
        entry: python3 tools/validate_manifests_xlsx.py
        language: system
        pass_filenames: false
        files: '^catalogs/manifests\.xlsx$'
    -   id: catalog-markdown-check
        name: catalog.md check
        entry: python3 tools/catalog_to_markdown.py --check
        language: system
        pass_filenames: false
        files: '^(catalogs/manifests\.xlsx|docs/catalog\.md)$'
